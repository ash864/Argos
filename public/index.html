<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131314">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <title>Argos</title>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4285f4"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/></linearGradient></defs></svg>
  <div id="scrim" hidden></div>
  <aside id="drawer" aria-label="Chat history">
    <div class="drawer-head"><span class="brand">Argos</span></div>
    <button id="newChat" class="pill-btn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New chat</button>
    <div class="drawer-label">Recent</div>
    <ul id="history"></ul>
  </aside>

  <header>
    <button id="menu" class="icon-btn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="brand">Argos</span>
    <button id="newTop" class="icon-btn" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/></svg></button>
  </header>

  <main id="chat">
    <section id="welcome">
      <svg class="spark" viewBox="0 0 24 24"><path fill="url(#sg)" stroke="none" d="M12 2c.5 4.5 5.5 9.5 10 10-4.5.5-9.5 5.5-10 10-.5-4.5-5.5-9.5-10-10 4.5-.5 9.5-5.5 10-10z"/></svg>
      <h1 class="gradient-text" id="greeting">Hello</h1>
      <h2>How can I help you today?</h2>
      <div id="chips">
        <button class="chip">Explain something simply</button>
        <button class="chip">Help me write a message</button>
        <button class="chip">Plan my day</button>
        <button class="chip">Brainstorm ideas</button>
      </div>
    </section>
    <div id="messages"></div>
  </main>

  <form id="composer" autocomplete="off">
    <div class="bar">
      <textarea id="input" rows="1" placeholder="Ask Argos" aria-label="Message"></textarea>
      <button type="button" id="mic" class="icon-btn" aria-label="Voice input"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button type="submit" id="send" class="icon-btn send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      <button type="button" id="stop" class="icon-btn send" aria-label="Stop" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
    </div>
    <p class="note">Argos can make mistakes. Check important info.</p>
  </form>

  <script src="/app.js"></script>
</body>
</html>
